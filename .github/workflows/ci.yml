
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            git-lfs \
            gcc-arm-none-eabi

      - name: Cache Odin
        id: cache-odin
        uses: actions/cache@v4
        with:
          path: ~/Odin
          key: odin-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.odin-version') }}

      - name: Install Odin
        if: steps.cache-odin.outputs.cache-hit != 'true'
        run: |
          ODIN_VERSION=$(cat .odin-version)

          git clone --depth 1 \
            --branch "$ODIN_VERSION" \
            https://github.com/odin-lang/Odin.git \
            "$HOME/Odin"

          cd "$HOME/Odin"
          git lfs pull
          make release

      - name: Add Odin to PATH
        run: echo "$HOME/Odin" >> "$GITHUB_PATH"

      - name: Check Odin version
        run: odin version

      - name: Build ode
        run: |
          mkdir -p bin
          odin build tools/ode -out:bin/ode

      - name: Build STM32F756 test firmware
        run: ./bin/ode build tests/fixtures/stm32f756_minimal

      - name: Build examples
        run: ./bin/ode build examples/minimal

      - name: Run tests
        run: |
          odin test tests \
            -all-packages \
            -collection:embedded=src
